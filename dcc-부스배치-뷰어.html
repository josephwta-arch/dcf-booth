<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DCC 제2전시장 · 부스배치도 (열람용)</title>
<!--
====================================================================
  2026 대전콘텐츠페어 · 부스배치도 열람 전용 뷰어
  - 편집 불가. 부스배치 JSON을 읽어 그대로 표시만 합니다.
  - 데이터 우선순위: ?data=<URL> → 같은 폴더의 dcc-부스배치.json
    → 이 브라우저 자동저장(localStorage) → 직접 파일 열기
  - 편집기(dcc-1m-unit-grid.html)에서 「💾 파일로 저장」한 JSON을
    이 파일과 같은 폴더에 dcc-부스배치.json 이름으로 올리면 됩니다.
====================================================================
-->
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<style>
  :root{
    --ink:#1b2734; --ink-soft:#5a6876; --line:#dbe1e8; --panel:#ffffff; --stage:#e9edf1;
    --hall:#fbfcfe; --grid-1m:#dfe3e8; --grid-col:#7fb0d8; --bound:#2a3a4b;
    --accent:#e0912f; --accent-soft:rgba(224,145,47,.20);
    --booth-fill:rgba(45,110,170,.16); --booth-line:#2d6eaa; --booth-label:#1d4e78;
    --invalid-fill:rgba(206,58,58,.18); --invalid-line:#cf3a3a;
    --door-fill:rgba(38,158,106,.22); --door-line:#1f8f5f;
    --wc-fill:rgba(37,140,160,.16); --wc-line:#1f8c96; --wc-label:#14646c;
    --hydrant:#d8352e;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:"Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--stage);
    height:100vh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;-webkit-font-smoothing:antialiased}

  /* ---- header ---- */
  header.bar{background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
  .title .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
  .title h1{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin-top:2px}
  .spacer{flex:1 1 auto}
  .meta{font-size:12px;color:var(--ink-soft);white-space:nowrap}
  .meta b{color:var(--ink);font-weight:700}
  .search{position:relative;display:flex;align-items:center}
  .search input{font-family:var(--sans);font-size:13px;padding:8px 30px 8px 12px;border:1px solid var(--line);
    border-radius:8px;width:220px;color:var(--ink);background:#fff}
  .search input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .search .cnt{position:absolute;right:10px;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft)}
  .btn{font-family:var(--sans);font-size:12.5px;padding:8px 12px;border:1px solid var(--line);background:#fff;
    border-radius:8px;cursor:pointer;color:var(--ink);white-space:nowrap}
  .btn:hover{border-color:#b6c1cd}

  /* ---- stage ---- */
  .stage{position:relative;overflow:hidden}
  #cv{display:block;width:100%;height:100%;cursor:grab}
  .hud{position:absolute;right:14px;bottom:12px;background:rgba(255,255,255,.9);border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:11px;color:var(--ink-soft);
    display:flex;gap:8px;align-items:center;pointer-events:none;backdrop-filter:blur(2px)}
  .hud b{color:var(--ink);font-weight:700}
  /* hover tooltip */
  #tip{position:fixed;display:none;z-index:20;pointer-events:none;background:#1b2734;color:#fff;
    border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.22);max-width:220px}
  #tip b{font-family:var(--mono);font-size:13px;display:block}
  #tip span{display:block;color:#c9d4df;margin-top:1px}
  /* empty state */
  #empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--stage)}
  #empty .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 30px;text-align:center;max-width:420px}
  #empty h2{font-size:16px;margin-bottom:8px}
  #empty p{font-size:13px;color:var(--ink-soft);line-height:1.6;margin-bottom:16px}

  /* ---- footer ---- */
  footer.hint{background:var(--panel);border-top:1px solid var(--line);
    font-size:11.5px;color:var(--ink-soft);padding:9px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .lg{display:inline-flex;align-items:center;gap:5px}
  .sw{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15);display:inline-block}
  @media (max-width:640px){ .search input{width:150px} .title h1{font-size:14px} }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <header class="bar">
    <div class="title">
      <div class="eyebrow">2026 대전콘텐츠페어 · DCC 제2전시장</div>
      <h1>부스배치도 <span style="color:var(--ink-soft);font-weight:500">· 열람용</span></h1>
    </div>
    <div class="spacer"></div>
    <div class="search">
      <input id="q" type="text" placeholder="업체명·부스번호 검색" autocomplete="off" />
      <span class="cnt" id="qCount"></span>
    </div>
    <button class="btn" id="fitBtn">화면 맞춤</button>
    <div class="meta" id="meta">불러오는 중…</div>
  </header>

  <main class="stage">
    <canvas id="cv"></canvas>
    <div class="hud"><span id="hudA">–</span><span>·</span><span id="hudB">–</span></div>
    <div id="tip"></div>
    <div id="empty">
      <div class="card">
        <h2>표시할 부스배치도가 없습니다</h2>
        <p>편집기에서 <b>「💾 파일로 저장」</b>한 JSON 파일을 열어주세요.<br>
           (또는 이 파일과 같은 폴더에 <b>dcc-부스배치.json</b>으로 올리면 자동으로 표시됩니다.)</p>
        <button class="btn" id="openBtn">📂 JSON 파일 열기</button>
        <input type="file" id="fileInput" accept="application/json,.json" style="display:none" />
      </div>
    </div>
  </main>

  <footer class="hint">
    <span>드래그: 화면 이동 · 휠: 확대/축소 · 부스에 마우스: 정보 · 검색으로 부스 찾기</span>
    <span class="lg"><span class="sw" style="background:var(--door-fill);border-color:var(--door-line)"></span>문</span>
    <span class="lg"><span class="sw" style="background:var(--wc-fill);border-color:var(--wc-line)"></span>화장실</span>
    <span class="lg"><span class="sw" style="background:var(--hydrant)"></span>소화전</span>
  </footer>

<script>
(function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const stage = cv.parentElement;
  const tip = document.getElementById('tip');

  const PAD = 46;
  const BOOTH = 3;
  const DOOR = {w:3, h:1};
  const WC   = {w:6, h:4};
  const HYD  = {w:1, h:1};
  const LS_KEY = 'dcc-booth-layout@1';

  const state = {
    w:131, d:76, target:10150.74,
    scale:8, offX:0, offY:0,
    showCol:false, showRuler:true, showHalls:true,
    hover:null, hoverBooth:null, _hi:null, updatedAt:null,
    booths:[], features:[], participants:[],
    dpr: Math.max(1, window.devicePixelRatio||1),
  };
  let drag = null;   // 뷰어에서는 항상 null (그리기 함수의 편집 하이라이트 비활성)

  /* ================= 렌더링 (편집기와 동일) ================= */
  const fmt = n => n.toLocaleString('ko-KR');
  function cssSize(){ return {w:cv.clientWidth, h:cv.clientHeight}; }
  function gutter(){ return state.showRuler ? PAD : 14; }
  function fitView(){
    const {w:cw,h:ch}=cssSize(); const g=gutter();
    const availW=cw-g-16, availH=ch-g-16;
    const s=Math.min(availW/state.w, availH/state.d);
    state.scale = s>0 ? s*0.94 : 8;
    const drawW=state.w*state.scale, drawH=state.d*state.scale;
    state.offX = g + (availW-drawW)/2;
    state.offY = g + (availH-drawH)/2;
  }
  const toScreen=(mx,my)=>({x:state.offX+mx*state.scale, y:state.offY+my*state.scale});
  const toWorld =(px,py)=>({x:(px-state.offX)/state.scale, y:(py-state.offY)/state.scale});

  function resize(){
    const {w,h}=cssSize();
    cv.width=Math.round(w*state.dpr); cv.height=Math.round(h*state.dpr);
    ctx.setTransform(state.dpr,0,0,state.dpr,0,0);
    fitView(); draw();
  }
  window.addEventListener('resize', resize);

  function line(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }

  function draw(){
    const {w:cw,h:ch}=cssSize();
    ctx.clearRect(0,0,cw,ch);
    const tl=toScreen(0,0), br=toScreen(state.w,state.d);

    // hall fill
    ctx.fillStyle=getCSS('--hall');
    ctx.fillRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);

    // clip to hall for grid
    ctx.save();
    ctx.beginPath(); ctx.rect(tl.x,tl.y,br.x-tl.x,br.y-tl.y); ctx.clip();
    // 1m dotted grid
    ctx.lineWidth=1; ctx.strokeStyle=getCSS('--grid-1m'); ctx.setLineDash([1.5, 3]);
    for(let x=1;x<state.w;x++){ const p=toScreen(x,0); line(p.x,tl.y,p.x,br.y); }
    for(let y=1;y<state.d;y++){ const p=toScreen(0,y); line(tl.x,p.y,br.x,p.y); }
    ctx.setLineDash([]);
    ctx.restore();

    // boundary
    ctx.strokeStyle=getCSS('--bound'); ctx.lineWidth=2; ctx.setLineDash([]);
    ctx.strokeRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);

    drawHallDivisions();
    drawZones();
    drawBooths();
    drawFeatures();
    drawHighlights();
    if(state.showRuler) drawRulers(tl,br);
  }

  function drawRulers(tl,br){
    const s=state.scale;
    ctx.fillStyle=getCSS('--ink-soft'); ctx.strokeStyle=getCSS('--line'); ctx.lineWidth=1;
    ctx.font='10px '+getCSS('--mono');
    const step = s<6 ? 10 : 5;
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    for(let x=0;x<=state.w+0.001;x+=step){ const p=toScreen(x,0); line(p.x,tl.y-6,p.x,tl.y); ctx.fillText(x.toString(), p.x, tl.y-9); }
    ctx.textAlign='right'; ctx.textBaseline='middle';
    for(let y=0;y<=state.d+0.001;y+=step){ const p=toScreen(0,y); line(tl.x-6,p.y,tl.x,p.y); ctx.fillText(y.toString(), tl.x-9, p.y); }
    ctx.textAlign='right'; ctx.textBaseline='alphabetic';
    ctx.fillStyle=getCSS('--accent'); ctx.fillText('m', tl.x-9, tl.y-9);
  }

  function getCSS(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function fitText(txt, maxW){
    txt=String(txt);
    if(maxW<=0) return '';
    if(ctx.measureText(txt).width<=maxW) return txt;
    let t=txt;
    while(t.length>0 && ctx.measureText(t).width>maxW) t=t.slice(0,-1);
    return t;
  }
  function hexToRgb(h){ h=String(h).replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
  function rgbaOf(h,a){ const c=hexToRgb(h); return `rgba(${c.r},${c.g},${c.b},${a})`; }
  function shade(h,f){ const c=hexToRgb(h), ch=v=>Math.max(0,Math.min(255,Math.round(v*f))); return `rgb(${ch(c.r)},${ch(c.g)},${ch(c.b)})`; }
  function roundRectPath(x,y,w,h,r){
    r=Math.max(0,Math.min(r,w/2,h/2));
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function drawExtinguisher(cx, cy, H){
    ctx.save();
    ctx.fillStyle='#fff'; ctx.strokeStyle='#fff';
    const tw=H*0.5, th=H*0.62, tx=cx-tw/2, ty=cy-th*0.30;
    roundRectPath(tx,ty,tw,th,Math.min(3,tw*0.3)); ctx.fill();
    const cw=tw*0.34, chh=H*0.14;
    roundRectPath(cx-cw/2, ty-chh*0.85, cw, chh, chh*0.3); ctx.fill();
    const hw=tw*0.9, hh=H*0.11;
    roundRectPath(cx-hw*0.15, ty-chh*0.85-hh, hw, hh, hh*0.45); ctx.fill();
    ctx.lineWidth=Math.max(0.8,H*0.06); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(cx-hw*0.15, ty-chh*0.85-hh*0.4); ctx.lineTo(cx-tw*0.62, ty+th*0.28); ctx.stroke();
    ctx.restore();
  }

  function drawBooths(){
    const s=state.scale;
    ctx.setLineDash([]); ctx.textAlign='center'; ctx.textBaseline='middle';
    for(const b of state.booths){
      const p=toScreen(b.x,b.y), sz=BOOTH*s;
      const base = b.color || getCSS('--booth-line');
      ctx.fillStyle = rgbaOf(base,0.18);
      ctx.fillRect(p.x,p.y,sz,sz);
      ctx.strokeStyle = base; ctx.lineWidth = 1.8;
      ctx.strokeRect(p.x+0.75,p.y+0.75,sz-1.5,sz-1.5);
      const cx=p.x+sz/2, cy=p.y+sz/2;
      const labelCol = shade(base,0.55);
      const availW = sz - 2;
      ctx.fillStyle=labelCol;
      const nm = (b.sn!=null ? (participantName(b.sn)||'') : (b.name||''));
      if(nm){
        const disp = nm.slice(0,6);
        const numF = Math.max(7, Math.min(14, s*0.82));
        let nameF  = Math.max(4, Math.min(11, s*0.6));
        const minShow = disp.slice(0, Math.min(4, disp.length));
        ctx.font=`500 ${nameF}px `+getCSS('--sans');
        while(nameF>3.5 && ctx.measureText(minShow).width > availW){ nameF-=0.5; ctx.font=`500 ${nameF}px `+getCSS('--sans'); }
        ctx.font=`700 ${numF}px `+getCSS('--mono');
        ctx.fillText(fitText(b.num, availW), cx, cy - nameF*0.72);
        ctx.font=`500 ${nameF}px `+getCSS('--sans');
        ctx.fillText(fitText(disp, availW), cx, cy + numF*0.60);
      } else {
        const numF = Math.max(7, Math.min(15, s*0.9));
        ctx.font=`700 ${numF}px `+getCSS('--mono');
        ctx.fillText(fitText(b.num, availW), cx, cy);
      }
    }
  }

  function drawZones(){
    const s=state.scale;
    ctx.textAlign='center';
    for(const z of state.features){
      if(z.type!=='zone') continue;
      const p=toScreen(z.x,z.y), w=z.w*s, h=z.h*s, base=z.color||'#8a94a0';
      ctx.fillStyle=rgbaOf(base,0.16); ctx.fillRect(p.x,p.y,w,h);
      ctx.setLineDash([6,4]); ctx.lineWidth=1.4; ctx.strokeStyle=rgbaOf(base,0.6);
      ctx.strokeRect(p.x+0.75,p.y+0.75,w-1.5,h-1.5); ctx.setLineDash([]);
      if(z.name){
        ctx.fillStyle=rgbaOf(shade(base,0.45),0.9);
        ctx.font=`700 ${Math.max(10,Math.min(18,s*1.0))}px `+getCSS('--sans');
        ctx.textBaseline='top';
        ctx.fillText(fitText(z.name, w-10), p.x+w/2, p.y+4);
        ctx.textBaseline='middle';
      }
    }
  }
  function drawFeatures(){
    const s=state.scale;
    ctx.setLineDash([]); ctx.textAlign='center'; ctx.textBaseline='middle';
    for(const f of state.features){
      if(f.type==='zone') continue;        // 구역은 drawZones()에서 바닥층으로 처리
      const p=toScreen(f.x,f.y), w=f.w*s, h=f.h*s;
      if(f.type==='aux'){
        const base=f.color || '#55606b';
        ctx.fillStyle=rgbaOf(base,0.16); ctx.fillRect(p.x,p.y,w,h);
        ctx.strokeStyle=base; ctx.lineWidth=1.6;
        ctx.strokeRect(p.x+0.75,p.y+0.75,w-1.5,h-1.5);
        ctx.fillStyle=shade(base,0.5);
        ctx.font=`600 ${Math.max(9,Math.min(15,s*0.8))}px `+getCSS('--sans');
        ctx.fillText(fitText(f.name||'시설물', w-8), p.x+w/2, p.y+h/2);
        continue;
      }
      if(f.type==='hydrant'){
        const base=getCSS('--hydrant')||'#d8352e';
        const r=Math.min(3,(w-2)*0.2);
        roundRectPath(p.x+1,p.y+1,w-2,h-2,r); ctx.fillStyle=base; ctx.fill();
        ctx.lineWidth=1; ctx.strokeStyle=shade(base,0.8); ctx.stroke();
        drawExtinguisher(p.x+w/2, p.y+h/2, Math.min(w,h)*0.72);
        continue;
      }
      const isDoor = f.type==='door';
      ctx.fillStyle = isDoor ? getCSS('--door-fill') : getCSS('--wc-fill');
      ctx.fillRect(p.x,p.y,w,h);
      ctx.strokeStyle = isDoor ? getCSS('--door-line') : getCSS('--wc-line');
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x+1,p.y+1,w-2,h-2);
      ctx.fillStyle = isDoor ? getCSS('--door-line') : getCSS('--wc-label');
      ctx.font = `700 ${Math.max(9,Math.min(16,s*0.9))}px `+getCSS('--sans');
      ctx.fillText(isDoor ? fitText(f.label||'문', w-4) : '화장실', p.x+w/2, p.y+h/2);
    }
  }

  function drawHallDivisions(){
    if(!state.showHalls || state.w < 100) return;
    const n=4, hw=state.w/n;
    const tl=toScreen(0,0), br=toScreen(state.w,state.d);
    ctx.save();
    ctx.beginPath(); ctx.rect(tl.x,tl.y,br.x-tl.x,br.y-tl.y); ctx.clip();
    ctx.strokeStyle='#d3d9df'; ctx.lineWidth=1; ctx.setLineDash([6,5]);
    for(let k=1;k<n;k++){ const p=toScreen(k*hw,0); ctx.beginPath(); ctx.moveTo(p.x,tl.y); ctx.lineTo(p.x,br.y); ctx.stroke(); }
    ctx.setLineDash([]);
    ctx.restore();
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillStyle=getCSS('--ink-soft'); ctx.font='600 12px '+getCSS('--sans');
    const ly = tl.y - (state.showRuler ? 26 : 10);
    for(let i=0;i<n;i++){ const cx=toScreen((i+0.5)*hw,0).x; ctx.fillText(`전시장 ${i+1}`, cx, ly); }
  }

  function drawHighlights(){
    const s=state.scale; ctx.save(); ctx.setLineDash([]);
    if(state._hi && state._hi.size){
      ctx.strokeStyle=getCSS('--accent'); ctx.lineWidth=3;
      for(const b of state.booths){ if(state._hi.has(b.id)){ const p=toScreen(b.x,b.y), sz=BOOTH*s; ctx.strokeRect(p.x-1.5,p.y-1.5,sz+3,sz+3); } }
    }
    if(state.hoverBooth){ const b=state.hoverBooth, p=toScreen(b.x,b.y), sz=BOOTH*s; ctx.strokeStyle=getCSS('--accent'); ctx.lineWidth=2.5; ctx.strokeRect(p.x-1,p.y-1,sz+2,sz+2); }
    ctx.restore();
  }

  /* ================= 데이터/도우미 ================= */
  function participantName(sn){ if(sn==null) return null; const p=state.participants.find(x=>x.sn===sn); return p?p.name:null; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function boothAt(mx,my){ for(let i=state.booths.length-1;i>=0;i--){ const b=state.booths[i]; if(mx>=b.x && mx<b.x+BOOTH && my>=b.y && my<b.y+BOOTH) return b; } return null; }

  function updateMeta(){
    document.getElementById('hudA').innerHTML = `전관 <b>${state.w}</b> × <b>${state.d}</b> m`;
    document.getElementById('hudB').innerHTML = `부스 <b>${fmt(state.booths.length)}</b>개`;
    let m = `부스 <b>${fmt(state.booths.length)}</b>개`;
    if(state.updatedAt){ const d=new Date(state.updatedAt); if(!isNaN(d)) m += ` · 갱신 ${d.toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'short'})}`; }
    document.getElementById('meta').innerHTML = m;
  }
  function showEmpty(){ document.getElementById('empty').style.display='flex'; document.getElementById('meta').textContent='데이터 없음'; }
  function hideEmpty(){ document.getElementById('empty').style.display='none'; }

  function applyData(d){
    if(typeof d.w==='number') state.w=d.w;
    if(typeof d.d==='number') state.d=d.d;
    if(d.target!=null) state.target=d.target;
    if(typeof d.showHalls==='boolean') state.showHalls=d.showHalls;
    state.booths      = Array.isArray(d.booths)?d.booths:[];
    state.features    = Array.isArray(d.features)?d.features:[];
    state.participants= Array.isArray(d.participants)?d.participants:[];
    state.updatedAt   = d.exportedAt || d.updatedAt || null;
    hideEmpty(); updateMeta(); fitView(); draw();
  }
  function readFile(f){ const r=new FileReader(); r.onload=()=>{ try{ applyData(JSON.parse(r.result)); }catch(err){ alert('JSON을 읽지 못했습니다: '+err.message); } }; r.readAsText(f); }

  async function loadLayout(){
    const url = new URLSearchParams(location.search).get('data') || './dcc-부스배치.json';
    try{ const res=await fetch(url,{cache:'no-store'}); if(res.ok){ applyData(await res.json()); return; } }catch(e){}
    try{ const s=localStorage.getItem(LS_KEY); if(s){ applyData(JSON.parse(s)); return; } }catch(e){}
    showEmpty();
  }

  /* ================= 뷰어 상호작용 (편집 없음) ================= */
  // 확대/축소 (커서 기준)
  stage.addEventListener('wheel', e=>{
    e.preventDefault();
    const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    const before=toWorld(mx,my);
    state.scale = Math.max(1.2, Math.min(60, state.scale*Math.exp(-e.deltaY*0.0015)));
    state.offX = mx - before.x*state.scale;
    state.offY = my - before.y*state.scale;
    draw();
  }, {passive:false});

  // 화면 이동 + 부스 호버
  let pan=null;
  cv.addEventListener('pointerdown', e=>{ pan={x:e.clientX,y:e.clientY,ox:state.offX,oy:state.offY}; try{cv.setPointerCapture(e.pointerId);}catch(_){}; cv.style.cursor='grabbing'; hideTip(); });
  cv.addEventListener('pointermove', e=>{
    if(pan){ state.offX=pan.ox+(e.clientX-pan.x); state.offY=pan.oy+(e.clientY-pan.y); draw(); return; }
    const r=cv.getBoundingClientRect(), w=toWorld(e.clientX-r.left, e.clientY-r.top);
    const b=boothAt(w.x,w.y);
    if(b!==state.hoverBooth){ state.hoverBooth=b; draw(); }
    if(b){
      const nm=participantName(b.sn)||b.name||'';
      tip.innerHTML='<b>'+esc(b.num||'(번호 없음)')+'</b>'+(nm?'<span>'+esc(nm)+'</span>':'');
      tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px';
    } else hideTip();
  });
  window.addEventListener('pointerup', ()=>{ if(pan){ pan=null; cv.style.cursor='grab'; } });
  cv.addEventListener('pointerleave', ()=>{ if(state.hoverBooth){ state.hoverBooth=null; draw(); } hideTip(); });
  function hideTip(){ tip.style.display='none'; }

  // 검색 (업체명·부스번호 하이라이트)
  const qEl=document.getElementById('q');
  qEl.addEventListener('input', ()=>{
    const q=qEl.value.trim().toLowerCase();
    if(!q){ state._hi=null; document.getElementById('qCount').textContent=''; draw(); return; }
    const hi=new Set(); let last=null;
    for(const b of state.booths){
      const nm=(participantName(b.sn)||b.name||'').toLowerCase();
      const num=(b.num||'').toLowerCase();
      if(num.includes(q)||nm.includes(q)){ hi.add(b.id); last=b; }
    }
    state._hi=hi;
    document.getElementById('qCount').textContent = hi.size ? hi.size+'건' : '없음';
    if(hi.size===1 && last){ const {w:cw,h:ch}=cssSize(); state.offX=cw/2-(last.x+BOOTH/2)*state.scale; state.offY=ch/2-(last.y+BOOTH/2)*state.scale; }
    draw();
  });

  // 화면 맞춤 / 파일 열기 / 드래그-드롭
  document.getElementById('fitBtn').addEventListener('click', ()=>{ fitView(); draw(); });
  const fileInput=document.getElementById('fileInput');
  document.getElementById('openBtn').addEventListener('click', ()=>fileInput.click());
  fileInput.addEventListener('change', e=>{ const f=e.target.files[0]; if(f) readFile(f); e.target.value=''; });
  stage.addEventListener('dragover', e=>{ e.preventDefault(); });
  stage.addEventListener('drop', e=>{ e.preventDefault(); const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) readFile(f); });

  /* ================= boot ================= */
  resize();
  loadLayout();
})();
</script>
</body>
</html>
